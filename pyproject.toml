[project]
name = "faultline"
version = "0.1.0"
description = "Bounded GenLayer dependency freshness and invalidation graph"
requires-python = ">=3.12,<3.15"
dependencies = [
  "genlayer-py==0.16.3",
  "genlayer-test==0.29.2",
  "genvm-linter==0.11.0",
  "pyright==1.1.411",
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
